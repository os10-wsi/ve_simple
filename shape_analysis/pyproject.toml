[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protshape"
version = "0.1.0"
description = "Proteome-wide protein and domain shape, compactness and hydrophobicity-distribution metrics from AlphaFold models"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "scikit-image", "pyarrow", "freesasa", "mdtraj",
  "biopython", "requests", "matplotlib", "seaborn", "umap-learn", "nbformat", "nbconvert", "ipykernel",
]

[project.scripts]
protshape = "protshape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
